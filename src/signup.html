<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wave | Sign Up</title>
    <link rel="icon" type="image/png" href="./img/wave-logo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f2f5fb;
        --card: #ffffff;
        --text: #10203a;
        --muted: #607087;
        --line: #d8e1ee;
        --accent: #1f5eff;
        --accent-soft: rgba(31, 94, 255, 0.08);
        --creator: #ef8d72;
        --error: #c44536;
        --success: #15803d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        font-family: "Space Grotesk", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(239, 141, 114, 0.18), transparent 24%),
          radial-gradient(circle at right, rgba(31, 94, 255, 0.12), transparent 26%),
          var(--bg);
      }

      .card {
        width: min(100%, 720px);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 32px;
        box-shadow: 0 24px 60px rgba(18, 35, 64, 0.1);
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 26px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .logo img {
        width: 48px;
        height: 48px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 2rem;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.6;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .field {
        margin-bottom: 16px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      label {
        display: block;
        font-size: 0.95rem;
        font-weight: 700;
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px 16px;
        font: inherit;
      }

      .roles {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .role-option input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .role-card {
        display: block;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 18px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .role-card strong {
        display: block;
        margin-bottom: 6px;
        font-size: 1rem;
      }

      .role-card span {
        color: var(--muted);
        line-height: 1.5;
      }

      .role-option input:checked + .role-card {
        border-color: var(--accent);
        background: var(--accent-soft);
        box-shadow: inset 0 0 0 1px var(--accent);
      }

      .role-card.influencer-tag input:checked + .role-card {
        border-color: var(--creator);
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 16px;
        padding: 15px;
        font: inherit;
        font-weight: 700;
        color: white;
        background: var(--accent);
        cursor: pointer;
      }

      .footer-links {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      .footer-links a {
        color: var(--text);
        font-weight: 700;
        text-decoration: none;
      }

      .form-note {
        min-height: 24px;
        margin: 10px 0 0;
        font-size: 0.92rem;
      }

      .form-note.error {
        color: var(--error);
      }

      .form-note.success {
        color: var(--success);
      }

      @media (max-width: 720px) {
        .grid,
        .roles {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body data-auto-redirect-auth="true">
    <div class="card">
      <div class="logo">
        <img src="./img/wave-logo.png" alt="Wave" />
        <span>Wave Sign Up</span>
      </div>
      <h1>Create your account</h1>
      <p>
        Pick how you want to enter Wave. The selected role controls whether you
        land in the brand dashboard or the influencer workspace after login.
      </p>

      <form id="signupForm">
        <div class="grid">
          <div class="field">
            <label for="signupName">Full name</label>
            <input id="signupName" type="text" placeholder="Debra Mulwa" required />
          </div>

          <div class="field">
            <label for="signupEmail">Email</label>
            <input id="signupEmail" type="email" placeholder="you@wave.io" required />
          </div>

          <div class="field full">
            <label for="signupPassword">Password</label>
            <input
              id="signupPassword"
              type="password"
              placeholder="At least 6 characters"
              required
            />
          </div>

          <div class="field full">
            <label>Choose your role</label>
            <div class="roles">
              <label class="role-option">
                <input type="radio" name="role" value="brand" checked />
                <span class="role-card">
                  <strong>Enter as Brand</strong>
                  <span>Set briefs, fund tasks, review proof, and release payments.</span>
                </span>
              </label>
              <label class="role-option">
                <input type="radio" name="role" value="influencer" />
                <span class="role-card">
                  <strong>Enter as Influencer</strong>
                  <span>Receive tasks, submit proof, and track your cumulative earnings.</span>
                </span>
              </label>
            </div>
          </div>
        </div>

        <button type="submit">Create Account</button>
        <div id="signupMessage" class="form-note"></div>
      </form>

      <div class="footer-links">
        <a href="/login">Already have an account?</a>
        <a href="/">Back to dashboard</a>
      </div>
    </div>

    <script type="module" src="/auth.js"></script>
  </body>
</html>
